server:
  port: 8080
  max-http-header-size: 2MB
  max-http-request-header-size: 2MB
  tomcat:
    max-http-header-size: 2MB

spring:
  flyway:
    enabled: true
    out-of-order: true
    validate-on-migrate: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:10.0.229.20}:${DB_PORT:5432}/${DB_NAME:vmd_csdl_v2_dev}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:admin}
    password: ${DB_PASS:Etc@1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  devtools:
    restart:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        hbm2ddl.auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    org.springframework.boot: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
    com.hanghai.kchtg: INFO

app:
  frontend-url: ${APP_FRONTEND_URL:http://10.0.229.20:30008}

