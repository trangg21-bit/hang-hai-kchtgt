# Profile: local (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:10.0.229.20}:${DB_PORT:5432}/${DB_NAME:vmd_csdl_v2_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=Etc@1234

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Server
server.port=8080

# Logging
logging.level.com.hanghai.kchtg=DEBUG
logging.level.org.springframework.security=DEBUG
# Disable data.sql — use RolePermissionSeeder + DataSeeder instead (they handle seeding at @Profile("local"))
spring.sql.init.mode=never
logging.level.org.hibernate=ERROR

# Apply pending schema migrations when running the local profile.
spring.flyway.enabled=true
