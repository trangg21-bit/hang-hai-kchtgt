# Profile: local (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:10.0.229.20}:${DB_PORT:5432}/${DB_NAME:vmd_csdl_v2}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=Etc@1234
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.devtools.restart.enabled=true

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Server
server.port=8080
server.max-http-header-size=2MB
server.max-http-request-header-size=2MB
server.tomcat.max-http-header-size=2MB
server.tomcat.max-swallow-size=50MB

# Multipart Upload Size (per specification: <= 20MB/file, <= 10 files/record, request <= 200MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB


# Logging
logging.level.root=INFO
logging.level.com.hanghai.kchtg=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate=WARN
# Disable data.sql — use RolePermissionSeeder + DataSeeder instead (they handle seeding at @Profile("local"))
spring.sql.init.mode=never

# Apply pending schema migrations when running the local profile.
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
