# Profile: local (PostgreSQL)
spring.datasource.url=jdbc:postgresql://10.0.229.20:5432/vmd_csdl_v2
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=vmd_mtis_geo
spring.datasource.password=VmdMtisPostgis@123

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8080

# Logging
logging.level.com.hanghai.kchtg=DEBUG
logging.level.org.springframework.security=DEBUG
# Disable data.sql — use RolePermissionSeeder + DataSeeder instead (they handle seeding at @Profile("local"))
spring.sql.init.mode=never
logging.level.org.hibernate=ERROR

# Flyway — disabled for local; Hibernate ddl-auto: update handles schema
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
