# Profile: local-h2 (H2 in-memory, no Redis — lightweight local dev)
spring:
  config:
    activate:
      on-profile: local-h2
  datasource:
    url: jdbc:h2:file:./data/h2/kchtg_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;INIT=CREATE ALIAS IF NOT EXISTS immutable_unaccent FOR 'com.hanghai.kchtg.common.util.H2Functions.unaccent'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
      encoding: UTF-8
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: 8080
  max-http-header-size: 2MB
  tomcat:
    max-http-header-size: 2MB


logging:
  level:
    com.hanghai.kchtg: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: ERROR
