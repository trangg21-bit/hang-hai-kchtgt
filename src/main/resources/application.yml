server:
  max-http-header-size: 32KB
  max-http-request-header-size: 32KB
  tomcat:
    max-http-header-size: 32KB


spring:
  application:
    name: kchtg-m001-quan-tri-he-thong
  # Default profile (dev with H2)
  profiles:
    active: local

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # File upload (multipart) — giới hạn theo quy ước feature-brief: ≤ 20MB/file, ≤ 10 files
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

  # Mail configuration (SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:son98hn@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:gmqfwvocvvhooiue}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
    default-encoding: UTF-8

  # Redis (TOTP enrollment sessions)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# -- JWT Configuration ------------------------------------------------
jwt:
  # TODO(SECURITY): Remove the checked-in fallback before production. Require JWT_SECRET
  # from a secret manager and fail fast when it is missing.
  secret: ${JWT_SECRET:aXRzLWEtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24taGFuZ2hhaS1rY2h0Zw==}
  expiration: 86400000
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
  mock-token: mock-jwt-token-2026

# -- TOTP / 2FA Configuration -----------------------------------------
totp:
  secret-length-bytes: 20
  code-length: 6
  period-seconds: 30
  tolerance-steps: 1
  max-attempts: 5
  lockout-duration-minutes: 15
  session-ttl-seconds: 300

# -- Encryption Configuration ------------------------------------------------
encryption:
  key: ${ENCRYPTION_KEY:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}

# -- Registration Configuration ------------------------------------------------
registration:
  # Password verification token TTL in minutes
  token-ttl-minutes: 30
  # Rate limiting
  rate-limit:
    max-requests: 5
    window-minutes: 5
  # RSA-2048 for client-side password encryption (optional)
  rsa:
    # Public key — shared with client for encryption (Base64-encoded X.509)
    public-key: ${REGISTRATION_RSA_PUBLIC_KEY:}
    # Private key — server-only, used for decryption (Base64-encoded PKCS#8)
    # TODO: Set REGISTRATION_RSA_PRIVATE_KEY env var. Remove this default before production.
# -- Application Configuration ------------------------------------------------
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3001}

---
# -- DEV profile (H2 in-memory) ------------------------------------------------
spring:
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile: dev
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:kchtg_m001;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8080
  max-http-header-size: 2MB
  tomcat:
    max-http-header-size: 2MB


logging:
  level:
    com.hanghai.kchtg: INFO
    org.springframework.security: INFO
    org.hibernate: ERROR

---
# -- PROD profile (PostgreSQL) ------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    out-of-order: true
    baseline-on-migrate: true
    validate-on-migrate: false
  datasource:
    url: ${SPRING_DATASOURCE_POSTGIS_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vmd_csdl_v2_dev}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_POSTGIS_USERNAME:${DB_USER:admin}}
    # TODO(production): drop the fallback and require DB_PASS.
    # Kept only while the system is in UAT — a checked-in production password is
    # readable by anyone with repository access.
    password: ${SPRING_DATASOURCE_POSTGIS_PASSWORD:${DB_PASS:Etc@1234}}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        hbm2ddl.auto: none

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.hanghai.kchtg: INFO
    org.springframework.security: WARN
