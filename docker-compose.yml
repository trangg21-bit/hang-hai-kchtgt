services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-Chuyen-Doi-So-2026-QuanTriHeThong-JWT-Secret-Key-256bit}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-Q3V0-Loc-2026-AES-256-Encryption-Key-B64}
      - REDIS_HOST=redis
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: hang-hai-kchtgt-frontend:latest
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      backend:
        condition: service_started
    profiles:
      - full
