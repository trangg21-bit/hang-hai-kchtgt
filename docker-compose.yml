
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      - POSTGRES_DB=${DB_NAME:-kchtg_m001}
      - POSTGRES_USER=${DB_USER:-kchtg}
      - POSTGRES_PASSWORD=${DB_PASS:-kchtg}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kchtg} -d ${DB_NAME:-kchtg_m001}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-Chuyen-Doi-So-2026-QuanTriHeThong-JWT-Secret-Key-256bit}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-Q3V0-Loc-2026-AES-256-Encryption-Key-B64}
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kchtg_m001}
      - DB_USER=${DB_USER:-kchtg}
      - DB_PASS=${DB_PASS:-kchtg}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: hang-hai-kchtgt-frontend:latest
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      backend:
        condition: service_started
    profiles:
      - full

volumes:
  pgdata:
